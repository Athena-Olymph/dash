<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentrium SOC — Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0B0F1A;
            background-image: radial-gradient(at 20% 30%, rgba(90, 109, 255, 0.15) 0, transparent 50%),
                              radial-gradient(at 80% 70%, rgba(34, 211, 238, 0.1) 0, transparent 50%);
            color: #E2E8F0; overflow: hidden;
        }
        .login-container { width: 100%; max-width: 420px; padding: 0 20px; }
        .login-card {
            background: rgba(15,23,42,0.75); backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
            padding: 36px 32px; box-shadow: 0 40px 80px rgba(0,0,0,0.5);
        }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.5px; color: #E2E8F0; text-transform: uppercase; }
        .brand p { font-size: 0.75rem; color: #64748B; font-weight: 500; margin-top: 4px; }

        .tabs { display: flex; gap: 2px; margin-bottom: 24px; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 3px; }
        .tab {
            flex: 1; padding: 9px 6px; text-align: center; font-size: 0.75rem; font-weight: 600;
            border-radius: 8px; cursor: pointer; transition: all 0.2s; border: none;
            background: transparent; color: #64748B; font-family: inherit; letter-spacing: 0.3px;
        }
        .tab:hover { color: #94A3B8; }
        .tab.active { background: rgba(90,109,255,0.2); color: #A5B4FC; }

        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: #94A3B8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px; }

        input[type="text"], input[type="password"] {
            width: 100%; padding: 11px 14px; font-size: 0.9rem; font-weight: 500;
            font-family: 'Inter', sans-serif; color: #F1F5F9;
            background: rgba(30,41,59,0.8); border: 2px solid rgba(100,116,139,0.25);
            border-radius: 10px; outline: none; transition: all 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #5A6DFF; box-shadow: 0 0 0 3px rgba(90,109,255,0.15); background: rgba(30,41,59,1); }

        .otp-row { display: flex; gap: 8px; justify-content: center; }
        .otp-d { width: 48px; height: 54px; text-align: center; font-size: 1.35rem; font-weight: 700; font-family: 'Inter', monospace; color: #F1F5F9; background: rgba(30,41,59,0.8); border: 2px solid rgba(100,116,139,0.25); border-radius: 10px; outline: none; transition: all 0.2s; caret-color: #5A6DFF; }
        .otp-d:focus { border-color: #5A6DFF; box-shadow: 0 0 0 3px rgba(90,109,255,0.15); }

        .error-msg { background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.25); color: #FDA4AF; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; text-align: center; margin-bottom: 16px; }

        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            font-size: 0.88rem; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: all 0.25s; letter-spacing: 0.3px;
            background: linear-gradient(135deg, #5A6DFF, #7C8AFF);
            color: #fff; box-shadow: 0 6px 20px rgba(90,109,255,0.3);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(90,109,255,0.4); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .footer { text-align: center; margin-top: 24px; font-size: 0.72rem; color: #475569; font-weight: 500; }
        .footer span { color: #5A6DFF; font-weight: 700; }

        .config-warning { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2); color: #FCD34D; padding: 12px 14px; border-radius: 10px; font-size: 0.78rem; font-weight: 600; text-align: center; margin-bottom: 16px; line-height: 1.5; }

        @media(max-width:480px) {
            .login-card { padding: 28px 20px; }
            .otp-d { width: 40px; height: 48px; font-size: 1.15rem; }
            .otp-row { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <h1>Sentrium</h1>
                <p>Security Operations Center</p>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            {% if not totp_configured and mode == "admin" %}
            <div class="config-warning">TOTP not configured. Add <strong>TOTP_SECRET</strong> to .env.</div>
            {% endif %}

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab {{ 'active' if mode == 'admin' else '' }}" data-mode="admin" onclick="switchMode('admin')">Admin</button>
                {% if clients_configured %}
                <button class="tab {{ 'active' if mode == 'client' else '' }}" data-mode="client" onclick="switchMode('client')">Client</button>
                {% endif %}
                {% if analysts_configured %}
                <button class="tab {{ 'active' if mode == 'analyst' else '' }}" data-mode="analyst" onclick="switchMode('analyst')">Analyst</button>
                {% endif %}
            </div>

            <form method="POST" action="/login" id="login-form">
                <input type="hidden" name="login_mode" id="login-mode" value="{{ mode }}">

                <!-- Admin Panel (TOTP) -->
                <div class="form-panel {{ 'active' if mode == 'admin' else '' }}" id="panel-admin">
                    <div class="form-group">
                        <label>Verification Code</label>
                        <div class="otp-row" id="otp-row">
                            <input type="text" class="otp-d" maxlength="1" data-i="0" autocomplete="off" inputmode="numeric">
                            <input type="text" class="otp-d" maxlength="1" data-i="1" autocomplete="off" inputmode="numeric">
                            <input type="text" class="otp-d" maxlength="1" data-i="2" autocomplete="off" inputmode="numeric">
                            <input type="text" class="otp-d" maxlength="1" data-i="3" autocomplete="off" inputmode="numeric">
                            <input type="text" class="otp-d" maxlength="1" data-i="4" autocomplete="off" inputmode="numeric">
                            <input type="text" class="otp-d" maxlength="1" data-i="5" autocomplete="off" inputmode="numeric">
                        </div>
                        <input type="hidden" name="totp_code" id="totp_code">
                    </div>
                    <button type="submit" class="btn">Authenticate</button>
                </div>

                <!-- Client Panel -->
                <div class="form-panel {{ 'active' if mode == 'client' else '' }}" id="panel-client">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" id="client-user" placeholder="e.g. acme-corp" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" id="client-pass" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn">Access Dashboard</button>
                </div>

                <!-- Analyst Panel -->
                <div class="form-panel {{ 'active' if mode == 'analyst' else '' }}" id="panel-analyst">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" id="analyst-user" placeholder="e.g. soc-analyst" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" id="analyst-pass" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn">Access Portal</button>
                </div>
            </form>

            <div class="footer">Secured by <span>Sentrium Security</span></div>
        </div>
    </div>

    <script>
        function switchMode(mode) {
            document.getElementById('login-mode').value = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
            document.querySelectorAll('.form-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + mode));
        }

        // OTP auto-advance
        const otps = document.querySelectorAll('.otp-d');
        const hi = document.getElementById('totp_code');
        const form = document.getElementById('login-form');

        function updateOtp() {
            hi.value = Array.from(otps).map(d => d.value).join('');
            if (hi.value.length === 6) form.submit();
        }

        otps.forEach((d, i) => {
            d.addEventListener('input', e => {
                const v = e.target.value.replace(/\D/g, '').slice(-1);
                e.target.value = v;
                updateOtp();
                if (v && i < 5) otps[i + 1].focus();
            });
            d.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !d.value && i > 0) { otps[i - 1].focus(); otps[i - 1].value = ''; updateOtp(); }
            });
            d.addEventListener('paste', e => {
                e.preventDefault();
                const s = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                s.split('').forEach((c, j) => { if (otps[j]) otps[j].value = c; });
                updateOtp();
                if (s.length === 6) form.submit();
                else if (otps[s.length]) otps[s.length].focus();
            });
        });

        // Focus first field based on active panel
        document.addEventListener('DOMContentLoaded', () => {
            const active = document.querySelector('.form-panel.active');
            if (active) active.querySelector('input:not([type=hidden])')?.focus();
        });
    </script>
</body>
</html>
